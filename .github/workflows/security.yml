---
name: Security

# Pull-request scanners. This workflow is not part of the required ci aggregate,
# and it does not replace the gitleaks range scan already in each CI lane.
'on':
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        run: bash scripts/security-scan.sh history

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with p/default
        env:
          SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/security-scan.sh semgrep

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Scan the npm lockfile
        run: bash scripts/security-scan.sh osv

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Audit workflows offline
        run: bash scripts/security-scan.sh zizmor
