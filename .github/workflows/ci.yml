---
name: CI

'on':
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: npm run check:actions
      - run: npm run check:lint-policy
      - run: npm run lint
      - run: npm run check:knip
      - run: npm run check:ts-prune
      - run: npm run check:md
      - run: npm run check:yaml
      - run: npm run check:ts
      - run: npm run check:test-runner
      - run: npm run check:dev-server
      - run: npm test
      - run: npm run build
