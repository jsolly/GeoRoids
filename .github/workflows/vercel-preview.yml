---
name: Vercel Preview

# Opt-in Preview deploys. Automatic Git Preview builds are off in vercel.json.
# Same-repo owner/member User comments `/preview` on a pull request, or run this
# workflow with a PR number. Requires GitHub secret VERCEL_TOKEN.
# issue_comment runs the workflow file from the default branch.

'on':
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to deploy as a Preview
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.issue.pull_request &&
          github.event.comment.user.type == 'User' &&
          contains(github.event.comment.body, '/preview') &&
          (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )
    env:
      VERCEL_ORG_ID: team_T8yHg0aDz7nCbyBgJh5a2saR
      VERCEL_PROJECT_ID: prj_us2dQ4PnjMkxVQ9VVn7NMATi1yuh
      EVENT_NAME: ${{ github.event_name }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      DISPATCH_PR: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail_resolve() {
            {
              echo "error<<PREVIEW_ERROR_EOF"
              printf '%s\n' "$1"
              echo "PREVIEW_ERROR_EOF"
              echo "skip=false"
            } >>"$GITHUB_OUTPUT"
            echo "$1" >&2
            exit 1
          }

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            if [[ ! -x scripts/vercel-preview-comment.sh ]]; then
              echo "scripts/vercel-preview-comment.sh is missing or not executable" >&2
              exit 1
            fi
            set +e
            printf '%s' "$COMMENT_BODY" | scripts/vercel-preview-comment.sh
            matcher_status=$?
            set -e
            if [[ "$matcher_status" -eq 1 ]]; then
              echo "Comment is not an explicit /preview request; stopping."
              echo "skip=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            pr_number="$ISSUE_NUMBER"
            if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid pull request number: ${pr_number:-empty}" >&2
              exit 1
            fi
            echo "pr_number=${pr_number}" >>"$GITHUB_OUTPUT"
            if [[ "$matcher_status" -ne 0 ]]; then
              fail_resolve "Preview comment matcher failed with exit ${matcher_status}"
            fi
          else
            pr_number="$DISPATCH_PR"
            if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid pull request number: ${pr_number:-empty}" >&2
              exit 1
            fi
            echo "pr_number=${pr_number}" >>"$GITHUB_OUTPUT"
          fi

          pr_json="$(gh api "repos/${REPO}/pulls/${pr_number}")"
          state="$(printf '%s\n' "$pr_json" | jq -r '.state')"
          head_sha="$(printf '%s\n' "$pr_json" | jq -r '.head.sha')"
          head_ref="$(printf '%s\n' "$pr_json" | jq -r '.head.ref')"
          head_repo="$(printf '%s\n' "$pr_json" | jq -r '.head.repo.full_name // empty')"

          if [[ "$state" != "open" ]]; then
            fail_resolve "PR ${pr_number} is ${state}; not deploying."
          fi
          if [[ "$head_repo" != "$REPO" ]]; then
            fail_resolve "PR ${pr_number} head repo ${head_repo} is not ${REPO}; not deploying forks."
          fi
          if [[ ! "$head_sha" =~ ^[a-f0-9]{40}$ ]]; then
            fail_resolve "PR head SHA is not a 40-character hex commit: ${head_sha}"
          fi
          if [[ ! "$head_ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            fail_resolve "PR head ref is not an allowed branch name: ${head_ref}"
          fi

          {
            echo "head_sha=${head_sha}"
            echo "head_ref=${head_ref}"
            echo "skip=false"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: ${{ steps.pr.outputs.skip != 'true' && steps.pr.outputs.head_sha != '' }}
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        if: ${{ steps.pr.outputs.skip != 'true' && steps.pr.outputs.head_sha != '' }}
        with:
          node-version-file: .nvmrc

      - name: Install Vercel CLI
        if: ${{ steps.pr.outputs.skip != 'true' && steps.pr.outputs.head_sha != '' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --omit=dev --no-fund --ignore-scripts vercel@59.20.0

      - name: Deploy the Preview
        if: ${{ steps.pr.outputs.skip != 'true' && steps.pr.outputs.head_sha != '' }}
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail

          fail() {
            {
              echo "error<<PREVIEW_ERROR_EOF"
              printf '%s\n' "$1"
              echo "PREVIEW_ERROR_EOF"
            } >>"$GITHUB_OUTPUT"
            echo "$1" >&2
            exit 1
          }

          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            fail "Preview deploy skipped: GitHub secret VERCEL_TOKEN is not set. Create a Vercel token with deploy access and add it as that secret, then comment /preview again."
          fi
          if [[ ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            fail "PR head SHA is not a 40-character hex commit: ${HEAD_SHA}"
          fi
          if [[ ! "$HEAD_REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            fail "PR head ref is not an allowed branch name: ${HEAD_REF}"
          fi

          local_sha="$(git rev-parse HEAD)"
          if [[ "$local_sha" != "$HEAD_SHA" ]]; then
            fail "Checked-out SHA ${local_sha} != PR head ${HEAD_SHA}"
          fi

          vercel_bin="$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel"
          if [[ ! -x "$vercel_bin" ]]; then
            fail "Vercel CLI is missing at ${vercel_bin}"
          fi

          # --archive=tgz does not upload .git. Vite and middleware need the PR SHA
          # explicitly: Git-integration system vars are often empty on CLI deploys.
          set +e
          deploy_log="$(
            "$vercel_bin" deploy --yes --archive=tgz --target=preview --scope jsollys-projects \
              --build-env "VERCEL_GIT_COMMIT_SHA=${HEAD_SHA}" \
              --build-env "GEOROIDS_COMMIT_SHA=${HEAD_SHA}" \
              --env "GEOROIDS_COMMIT_SHA=${HEAD_SHA}" \
              --meta "githubDeployment=1" \
              --meta "githubCommitSha=${HEAD_SHA}" \
              --meta "githubCommitRef=${HEAD_REF}" \
              --meta "githubCommitOrg=${REPO%%/*}" \
              --meta "githubCommitRepo=${REPO#*/}" \
              --meta "githubOrg=${REPO%%/*}" \
              --meta "githubRepo=${REPO#*/}" \
              --meta "githubPrId=${PR_NUMBER}" \
              2>&1
          )"
          deploy_status=$?
          set -e
          printf '%s\n' "$deploy_log" >&2
          preview_url="$(printf '%s\n' "$deploy_log" | grep -E '^https://' | tail -n 1 || true)"
          if [[ "$deploy_status" -ne 0 || ! "$preview_url" =~ ^https:// ]]; then
            fail "Vercel CLI preview deploy failed (exit ${deploy_status})."
          fi
          {
            echo "url<<PREVIEW_URL_EOF"
            printf '%s\n' "$preview_url"
            echo "PREVIEW_URL_EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Comment on the pull request
        if: ${{ always() && steps.pr.outputs.skip != 'true' && steps.pr.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_ERROR: ${{ steps.deploy.outputs.error }}
          RESOLVE_ERROR: ${{ steps.pr.outputs.error }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail

          comment() {
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$1"
          }

          if [[ "$DEPLOY_OUTCOME" == "success" && "$PREVIEW_URL" =~ ^https:// ]]; then
            comment "$(
              printf '%s\n\n%s\n%s\n' \
                "Preview for \`${HEAD_REF}\` (\`${HEAD_SHA}\`): ${PREVIEW_URL}" \
                "This is a one-shot deploy. New commits do not rebuild until you comment \`/preview\` again." \
                "Play still needs \`VITE_WEBSOCKET_URL\` on Vercel Preview to reach Railway; the title screen and wiki are enough to check client UI."
            )"
            exit 0
          fi

          reason="${DEPLOY_ERROR:-${RESOLVE_ERROR:-Preview deploy failed.}}"
          comment "$(
            printf '%s\n\n%s\n' \
              "Preview for \`${HEAD_REF:-unknown}\` (\`${HEAD_SHA:-unknown}\`) failed." \
              "$reason"
          )"
