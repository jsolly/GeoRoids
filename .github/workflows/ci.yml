---
name: CI

'on':
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  pull-requests: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-smoke:
    name: behavioral-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for a validated PR tree
        id: verified-tree
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-verified-tree.sh
      - name: Prepare behavioral artifacts
        if: steps.verified-tree.outputs.run_full != 'false'
        run: |
          mkdir -p behavioral-artifacts/logs behavioral-artifacts/screenshots
          echo "Runner has not started; inspect job setup steps if no test log follows." > behavioral-artifacts/README.txt
      - uses: actions/setup-node@v6
        if: steps.verified-tree.outputs.run_full != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.verified-tree.outputs.run_full != 'false'
      - name: Install pinned Playwright Chromium, WebKit and OS dependencies
        if: steps.verified-tree.outputs.run_full != 'false'
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Run serialized critical behavioral scenarios
        if: steps.verified-tree.outputs.run_full != 'false'
        run: |
          set +e
          set -o pipefail
          GEOROIDS_TEST_MAX_DURATION_SECONDS=300 ./scripts/test-runner.sh \
            tests/integration/browser/sanity/critical-gameplay-smoke.test.ts \
            tests/integration/browser/sanity/hauler-flies-with-one-ability.test.ts \
            tests/integration/browser/sanity/hauler-touch-taps-act-once-with-delayed-clicks.test.ts \
            tests/integration/browser/sanity/pilots-climb-and-descend-varied-terrain.test.ts \
            tests/integration/browser/roid/two-players-hit-big-roid-within-one-second-splits.test.ts \
            tests/integration/browser/sanity/mobile-viewport-fits-and-shows-touch-controls.test.ts \
            tests/integration/browser/sanity/wave2-touch-controls.test.ts \
            tests/integration/browser/sanity/crew-scoreboard-lists-pilots.test.ts \
            tests/integration/browser/sanity/leaderboard-long-names-fit-score-column.test.ts \
            tests/integration/browser/sanity/sustained-mobile-controls.test.ts \
            tests/integration/browser/sanity/mobile-quality-and-phone-recording.test.ts \
            tests/integration/browser/sanity/mobile-recovers-under-cpu-constraint.test.ts \
            tests/integration/browser/sanity/rejected-joins-return-to-menu-and-can-retry.test.ts \
            tests/integration/server/current-pilots-recover-after-reconnect.test.ts \
            tests/integration/server/player-motion-cross-real-sockets.test.ts \
            --reporter=verbose 2>&1 | tee behavioral-artifacts/test-run.log
          pipeline_statuses=("${PIPESTATUS[@]}")
          status=${pipeline_statuses[0]}
          tee_status=${pipeline_statuses[1]}
          if [[ "$tee_status" != 0 ]]; then
            echo "Failed to retain the behavioral test log (tee exit $tee_status)" >&2
            if [[ "$status" == 0 ]]; then status=1; fi
          fi
          for source in logs tests/integration/browser/screenshots; do
            destination=behavioral-artifacts/logs
            if [[ "$source" == tests/integration/browser/screenshots ]]; then
              destination=behavioral-artifacts/screenshots
            fi
            if [[ -d "$source" ]]; then
              if ! cp -a "$source"/. "$destination"/; then
                echo "Failed to copy $source" >&2
                if [[ "$status" == 0 ]]; then status=1; fi
              fi
            else
              echo "Artifact directory unavailable: $source (runner exit $status)" | tee -a behavioral-artifacts/README.txt
              if [[ "$status" == 0 ]]; then status=1; fi
            fi
          done
          exit "$status"
      - name: Report deterministic frame work budget
        if: steps.verified-tree.outputs.run_full != 'false'
        run: >-
          node --import tsx scripts/measure-frame-work.ts
          --budget docs/performance/frame-work-budget.json
          --output behavioral-artifacts/frame-work.json
      - name: Run constrained production client correctness
        if: steps.verified-tree.outputs.run_full != 'false'
        run: |
          set -euo pipefail
          GEOROIDS_TEST_MAX_DURATION_SECONDS=240 ./scripts/test-runner.sh --benchmark-client \
            --viewport touch-portrait --dpr 3 --cpu-slowdown 4 --network normal \
            --scenario traversal --seed 42 --warmup 5 --seconds 15 \
            --output behavioral-artifacts/mobile-combined.json 2>&1 | tee behavioral-artifacts/mobile-combined.log
          GEOROIDS_TEST_MAX_DURATION_SECONDS=240 ./scripts/test-runner.sh --benchmark-client \
            --viewport touch-portrait --dpr 3 --cpu-slowdown 1 --network clean \
            --scenario combat --seed 42 --warmup 5 --seconds 15 \
            --output behavioral-artifacts/mobile-combat.json 2>&1 | tee behavioral-artifacts/mobile-combat.log
      - name: Upload behavioral artifacts
        if: (always()) && steps.verified-tree.outputs.run_full != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: behavioral-smoke-${{ github.run_id }}
          path: behavioral-artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Record validated PR tree
        if: >-
          success() && github.event_name == 'pull_request' &&
          steps.verified-tree.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-tree-v1-${{ github.job }}-${{ steps.verified-tree.outputs.tree }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree-${{ github.job }}.txt
          if-no-files-found: error
          retention-days: 7

  ci:
    name: ci
    needs: behavioral-smoke
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for a validated PR tree
        id: verified-tree
        timeout-minutes: 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-verified-tree.sh
      - uses: actions/setup-node@v6
        if: steps.verified-tree.outputs.run_full != 'false'
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10.1.0
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm ci
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:actions
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:lint-policy
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:lint
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:knip
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:ts-prune
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:md
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:yaml
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:ts
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:benchmarks
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:test-runner
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run check:dev-server
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm test
        if: steps.verified-tree.outputs.run_full != 'false'
      - run: npm run build
        if: steps.verified-tree.outputs.run_full != 'false'
      - name: Require behavioral smoke lane to pass
        if: ${{ always() }}
        env:
          BEHAVIORAL_RESULT: ${{ needs.behavioral-smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$BEHAVIORAL_RESULT" != "success" ]]; then
            echo "Critical behavioral lane result: $BEHAVIORAL_RESULT" >&2
            exit 1
          fi
      - name: Record validated PR tree
        if: >-
          success() && github.event_name == 'pull_request' &&
          steps.verified-tree.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-tree-v1-${{ github.job }}-${{ steps.verified-tree.outputs.tree }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tree-${{ github.job }}.txt
          if-no-files-found: error
          retention-days: 7
