<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000011" />
    <meta name="color-scheme" content="dark" />
    <script defer type="module" src="/src/core/eventLoop.ts"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
      crossorigin="anonymous"
    ></script>

    <title>GeoRoids</title>
    <meta name="description" content="Play GeoRoids, a free multiplayer space game in your browser. Choose your ship, dodge asteroids, and battle other pilots in a live arena." />
    <link rel="canonical" href="https://www.georoids.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GeoRoids — Multiplayer Space Game" />
    <meta property="og:description" content="Choose your ship, dodge asteroids, and battle other pilots. Play this free multiplayer space game in your browser." />
    <meta property="og:url" content="https://www.georoids.com/" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <canvas id="title-starfield" aria-hidden="true"></canvas>
    <main id="gameWrapper">
      <div id="start-screen" class="screen">
        <h1 class="text-center">GeoRoids</h1>
        <p id="controls-hint" class="controls-hint">WASD + Space / arrows · E ability · F shield</p>

        <!-- Join the multiplayer session -->
        <div class="game-modes">
          <div class="mb-3">
            <label for="playerNameInput" class="form-label">Your Nickname</label>
            <input
              type="text"
              id="playerNameInput"
              maxlength="20"
              placeholder="Crimson Falcon"
              class="form-control"
            />

          </div>
          <fieldset class="ship-kit-select">
            <legend>Ship kit</legend>
            <div id="ship-kit-grid" class="ship-kit-grid" role="group" aria-label="Ship kit"></div>
            <p class="ship-kit-placeholder-note">AD v2 silhouettes</p>
          </fieldset>
          <ul class="nav flex-column">
            <li class="nav-item">
              <button id="start-game" class="btn btn-lg btn-phosphor">
                Enter Game
              </button>
            </li>
          </ul>
        </div>

        <!-- Settings -->
        <div class="settings">
          <ul class="nav flex-column">
            <li class="nav-item">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="soundPref"
                checked
              />
              <label class="form-check-label" for="soundPref">Sound</label>
            </li>
          </ul>
        </div>

        <p class="game-description">A free multiplayer space game. Choose your ship, dodge asteroids, and battle other pilots in your browser.</p>




      </div>

      <div id="gameArea" style="display: none">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="touch-controls" class="touch-controls" hidden aria-hidden="true">
          <div
            id="touch-stick"
            class="touch-stick"
            role="slider"
            aria-label="Steer and thrust"
          >
            <div id="touch-stick-knob" class="touch-stick-knob"></div>
          </div>
          <button
            id="touch-shield"
            type="button"
            class="touch-shield"
            aria-label="Shield"
            aria-disabled="true"
          >SHIELD</button>
          <button
            id="touch-ability"
            type="button"
            class="touch-ability"
            aria-label="Ability"
            aria-disabled="true"
          >E</button>
          <button id="touch-fire" type="button" class="touch-fire" aria-label="Fire">
            FIRE
          </button>
        </div>
      </div>






    </main>

    <div id="attribution">
      <span id="buildInfo" class="build-info"></span>
    </div>
  </body>
</html>
