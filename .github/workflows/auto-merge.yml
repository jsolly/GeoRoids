---
name: Auto Merge

# Squash-merge non-draft same-repo PRs from a human User who is the repo
# owner or an org OWNER/MEMBER (you or an agent using your credentials).
# Excludes Dependabot/bots/forks. pull_request job-level gate → skipped
# events burn zero minutes; workflow_run re-checks eligibility in-script.
#
# Do not use GitHub --auto. --auto only waits for *required* status checks.
# Free private repos cannot set required checks, so --auto can squash
# before CI starts. This workflow waits for the `ci` check (job name `ci`
# on workflow `CI`) to conclude success on a SHA that equals the open PR's
# current head, then merges. Fleet default names match this repo's
# .github/workflows/ci.yml; a consuming repo that copies this file must
# match those names to its own ci.yml, or edit workflow_run.workflows and
# the check-name filter below.
#
# GeoRoids-only: skip publisher-owned `codex/wiki-publish/*` branches so
# wiki-publish.yml owns those snapshot PRs. The pull_request job `if:` and
# the merge-script eligibility checks both enforce this.
#
# Failed/cancelled CI, push-to-main CI with no open PR, and green CI for a
# stale SHA after a new push do not merge (exit 0).
#
# github.event.workflow_run.pull_requests is empty even for
# pull_request-triggered CI on this repo — resolve the PR via gh pr list
# on the CI head SHA (current headRefOid), not the event payload.
#
# GITHUB_TOKEN-triggered events normally do not create new workflow runs.
# workflow_dispatch and repository_dispatch always do. When a workflow creates
# or updates a PR, pull_request opened/synchronize/reopened runs are created in
# an approval-required state; they are not unattended automation. See:
# GitHub's triggering-a-workflow guidance for the current behavior:
# https://docs.github.com/en/actions/concepts/security/github_token
# One user-owned GitHub App installed on All repositories; same APP_CLIENT_ID +
# APP_PRIVATE_KEY on every Actions repo. This file is the fleet canonical
# (templates/github/auto-merge.yml); copy it to .github/workflows/auto-merge.yml
# in each repo (they SHA-match here). When APP_PRIVATE_KEY + APP_CLIENT_ID
# (or APP_ID) are set, mint an App installation token (~1h, own identity) so
# the land is a real push. If unset, merge with GITHUB_TOKEN (do not fail).
# No classic PAT required. GH_TOKEN is the App installation token if minted,
# else GITHUB_TOKEN only — a present-but-invalid REPO_AUTOMATION_TOKEN must
# not fail the job (do not put it in the chain). Reads (PR list, check-runs)
# use GITHUB_TOKEN so the App token does not need checks:read.
#
# secrets cannot be referenced in steps.if (context availability). Hoist a
# boolean into job env and gate the mint step on it so unset credentials skip
# the action instead of failing it. Pass the private key only on the mint
# step's with: — not into every step's environment.

'on':
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        !startsWith(github.event.workflow_run.head_branch, 'codex/wiki-publish/')
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type == 'User' &&
        (
          github.event.pull_request.user.login == github.repository_owner ||
          github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER'
        ) &&
        !startsWith(github.event.pull_request.head.ref, 'codex/wiki-publish/')
      )
    env:
      HAS_APP_CREDS: ${{ secrets.APP_PRIVATE_KEY != '' && (vars.APP_CLIENT_ID != '' || secrets.APP_CLIENT_ID != '' || vars.APP_ID != '' || secrets.APP_ID != '') }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: ${{ env.HAS_APP_CREDS == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          # github-actionlint 1.7.x bundles pre-v3.1 metadata (no client-id).
          # templates/github/check-actions.sh -ignore covers that false positive.
          client-id: ${{ vars.APP_CLIENT_ID || secrets.APP_CLIENT_ID }}
          app-id: ${{ vars.APP_ID || secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge eligible owner/member PRs after ci
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # Reads (PR list, PR json, check-runs) run as GITHUB_TOKEN so the App token needs no
          # checks:read. Actions does NOT inject GITHUB_TOKEN into a step environment — it only
          # exists in ${{ secrets }} — so it must be passed explicitly here or `set -u` aborts the
          # merge step with "GITHUB_TOKEN: unbound variable" on the first read.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ "$HAS_APP_TOKEN" = "true" ]; then
            echo "Merging with GitHub App installation token (not GITHUB_TOKEN → push fires)."
          else
            echo "No App token — merging with GITHUB_TOKEN (do not fail)."
          fi

          skip() { echo "$1"; exit 0; }

          repo="$GITHUB_REPOSITORY"
          pr_number=""
          want_sha=""

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "${WR_CONCLUSION:-}" != "success" ]; then
              skip "CI workflow_run conclusion is '${WR_CONCLUSION:-empty}'; not merging."
            fi
            want_sha="${WR_HEAD_SHA:-}"
            if [ -z "$want_sha" ]; then
              skip "workflow_run has no head SHA; not merging."
            fi
            # workflow_run.pull_requests is empty even for pull_request CI here.
            # Map CI SHA → the open PR whose current head is that SHA.
            pr_number="$(
              GH_TOKEN="$GITHUB_TOKEN" gh pr list --repo "$repo" --state open --limit 100 \
                --json number,headRefOid \
                | jq -r --arg sha "$want_sha" '[.[] | select(.headRefOid == $sha) | .number] | first // empty'
            )"
            if [ -z "$pr_number" ]; then
              skip "No open PR whose current head is $want_sha; not merging."
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            pr_number="${PR_NUMBER:-}"
            if [ -z "$pr_number" ]; then
              skip "pull_request event has no number; not merging."
            fi
          else
            skip "Unsupported event ${EVENT_NAME:-empty}; not merging."
          fi

          pr_json="$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${repo}/pulls/${pr_number}")"
          draft="$(printf '%s\n' "$pr_json" | jq -r '.draft')"
          state="$(printf '%s\n' "$pr_json" | jq -r '.state')"
          head_sha="$(printf '%s\n' "$pr_json" | jq -r '.head.sha')"
          head_ref="$(printf '%s\n' "$pr_json" | jq -r '.head.ref')"
          head_repo="$(printf '%s\n' "$pr_json" | jq -r '.head.repo.full_name // empty')"
          user_type="$(printf '%s\n' "$pr_json" | jq -r '.user.type')"
          user_login="$(printf '%s\n' "$pr_json" | jq -r '.user.login')"
          assoc="$(printf '%s\n' "$pr_json" | jq -r '.author_association')"

          if [ "$state" != "open" ]; then
            skip "PR ${pr_number} is ${state}; not merging."
          fi
          if [ "$draft" != "false" ]; then
            skip "PR ${pr_number} is draft; not merging."
          fi
          if [ "$head_repo" != "$repo" ]; then
            skip "PR ${pr_number} head repo ${head_repo} != ${repo}; not merging."
          fi
          case "$head_ref" in
            codex/wiki-publish/*)
              skip "PR ${pr_number} head branch ${head_ref} is a wiki-publish snapshot; not merging."
              ;;
          esac
          if [ "$user_type" != "User" ]; then
            skip "PR ${pr_number} author type ${user_type}; not merging."
          fi
          if [ "$user_login" != "$REPO_OWNER" ] && [ "$assoc" != "OWNER" ] && [ "$assoc" != "MEMBER" ]; then
            skip "PR ${pr_number} author ${user_login} (${assoc}) is not owner/member; not merging."
          fi

          if [ -n "$want_sha" ] && [ "$head_sha" != "$want_sha" ]; then
            skip "PR ${pr_number} current head ${head_sha} != CI SHA ${want_sha}; not merging."
          fi

          check_sha="$head_sha"
          ci_conclusion="$(
            GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${repo}/commits/${check_sha}/check-runs?per_page=100" \
              | jq -r '[.check_runs[] | select(.name == "ci")] | sort_by(.completed_at // .started_at) | last | .conclusion // empty'
          )"
          if [ "$ci_conclusion" != "success" ]; then
            skip "ci check on ${check_sha} is '${ci_conclusion:-missing}'; not merging."
          fi

          head_now="$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${repo}/pulls/${pr_number}" --jq '.head.sha')"
          if [ "$head_now" != "$check_sha" ]; then
            skip "PR ${pr_number} head moved ${check_sha} -> ${head_now}; not merging."
          fi

          if ! gh pr merge --squash --delete-branch --match-head-commit "$check_sha" --repo "$repo" "$pr_number"; then
            head_after="$(GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${repo}/pulls/${pr_number}" --jq '.head.sha')"
            if [ "$head_after" != "$check_sha" ]; then
              skip "PR ${pr_number} head moved before merge (${check_sha} -> ${head_after}); not merging."
            fi
            echo "gh pr merge failed for PR ${pr_number}" >&2
            exit 1
          fi
