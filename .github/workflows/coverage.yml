---
name: Coverage report

# Full unit coverage is collected on demand, separately from the fast PR gate.
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify workflow tools without publishing
        timeout-minutes: 2
        env:
          VERCEL_TELEMETRY_DISABLED: '1'
        run: |
          test "$(uname -m)" = aarch64
          git --version
          gh --version
          jq --version
          npm install --prefix "$RUNNER_TEMP/vercel-cli" --omit=dev --no-fund --ignore-scripts vercel@59.20.0
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" --version
      - name: Collect coverage separately from performance measurements
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee "$RUNNER_TEMP/coverage-test-output.txt"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage
            ${{ runner.temp }}/coverage-test-output.txt
          if-no-files-found: error
          retention-days: 14
