# No mise.lock here. Railway's Railpack build copies .mise.toml and mise.lock (but not
# .mise/locks/) and runs `mise install` with its own, newer mise, which then fails on the locked
# Semgrep and osv-scanner entries, so the production server build fails (seen 2026-11-12).
[tools]
node = "26"
gitleaks = "8.24.2"
uv = "0.12.22"
zizmor = "1.32.0"
osv-scanner = "2.7.1"
semgrep = "1.185.0"
