---
name: Integration repeatability

'on':
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA to run on both native architectures
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-sample:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      SAMPLE_SHA: ${{ inputs.sha }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - name: Validate the pinned revision
        run: |
          ARTIFACTS="$RUNNER_TEMP/integration-repeatability-artifacts"
          printf 'ARTIFACTS=%s\n' "$ARTIFACTS" >> "$GITHUB_ENV"
          mkdir -p "$ARTIFACTS"
          printf 'Revision validation started\n' > "$ARTIFACTS/setup.txt"
          if [[ ! "$SAMPLE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Provide a full lowercase commit SHA.' >&2
            exit 64
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main revision and native architecture
        run: |
          test "$(git rev-parse HEAD)" = "$SAMPLE_SHA"
          git merge-base --is-ancestor "$SAMPLE_SHA" origin/main
          printf 'Setup started for %s on %s\n' "$SAMPLE_SHA" "$EXPECTED_ARCHITECTURE" >> "$ARTIFACTS/setup.txt"
          if [[ "$EXPECTED_ARCHITECTURE" == arm64 ]]; then
            test "$(uname -m)" = aarch64
          else
            test "$(uname -m)" = x86_64
          fi
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native canvas build prerequisites
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee "$ARTIFACTS/apt-update.log"
          sudo apt-get install -y build-essential pkg-config libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev 2>&1 | tee "$ARTIFACTS/canvas-build-prerequisites.log"
      - name: Install locked dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$ARTIFACTS/npm-ci.log"
      - name: Install pinned native browsers and operating system dependencies
        run: |
          set -o pipefail
          npx --no-install playwright install --with-deps chromium webkit 2>&1 | tee "$ARTIFACTS/browser-install.log"
      - name: Run the bounded serialized sample
        run: |
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCHITECTURE"
          node scripts/integration-repeatability.mjs \
            --sha "$SAMPLE_SHA" --focused 20 --full 3 \
            --output "$ARTIFACTS/sample"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: integration-repeatability-${{ matrix.architecture }}-${{ github.run_id }}
          path: ${{ runner.temp }}/integration-repeatability-artifacts
          if-no-files-found: error
          retention-days: 30
