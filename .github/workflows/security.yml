---
name: Security

# Pull-request scanners. This workflow is not part of the required ci aggregate,
# and it does not replace the gitleaks range scan already in each CI lane.
'on':
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        run: bash scripts/security-scan.sh history

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan with p/default
        env:
          SECURITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/security-scan.sh semgrep

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Scan the npm lockfile
        run: bash scripts/security-scan.sh osv

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Audit workflows offline
        run: bash scripts/security-scan.sh zizmor

  # The ruleset requires a check named exactly security. This job is that check.
  # It runs even when a scanner fails, and it succeeds only when every scanner did.
  security:
    name: security
    if: always()
    needs: [gitleaks, semgrep, osv-scanner, zizmor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every scanner to succeed
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          OSV_RESULT: ${{ needs.osv-scanner.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          set -euo pipefail
          if [[ "$GITLEAKS_RESULT" != success || "$SEMGREP_RESULT" != success ||
            "$OSV_RESULT" != success || "$ZIZMOR_RESULT" != success ]]; then
            echo "Security scanners failed: gitleaks=$GITLEAKS_RESULT semgrep=$SEMGREP_RESULT osv-scanner=$OSV_RESULT zizmor=$ZIZMOR_RESULT" >&2
            exit 1
          fi
