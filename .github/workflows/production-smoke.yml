---
name: Production smoke
# Every deployment status (pending, in_progress, success, inactive) starts a run; only success and manual runs
# carry the title /ship's follower discovers, so it never follows a skipped sibling.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Production smoke {0} {1}', inputs.release_sha, inputs.request_id) || (github.event.deployment_status.state == 'success' && format('Production smoke {0} {1}', github.event.deployment.sha, github.event.deployment.id)) || format('Production smoke status {0} {1}', github.event.deployment_status.state, github.event.deployment.id) }}
'on':
  deployment_status:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the production release to verify
        required: true
        type: string
      server_sha:
        description: Full separately deployed server commit SHA (when applicable)
        required: false
        type: string
      request_id:
        description: Unique UUID for this verification request
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-smoke-${{ github.event.deployment.id || inputs.request_id }}-${{ github.event.deployment_status.state || 'manual' }}
  cancel-in-progress: false
jobs:
  smoke:
    # Replace REPLACE_PRODUCTION_ENVIRONMENT with the host's production deployment environment name.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'GeoRoids / production' &&
       github.event.deployment.task == 'deploy' &&
       github.event.deployment.creator.login == 'railway-app[bot]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PRODUCTION_SMOKE_RELEASE_SHA: ${{ github.event.deployment.sha || inputs.release_sha }}
      PRODUCTION_SMOKE_SERVER_SHA: ${{ github.event.deployment.sha || inputs.server_sha }}
      PRODUCTION_SMOKE_REQUEST_ID: ${{ github.event.deployment.id || inputs.request_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The deployed commit's scenario, so a later merge's assertions never test an older build.
          ref: ${{ github.event.deployment.sha || inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run smoke:scenario-contract
      - run: npm run smoke:production
        env:
          PRODUCTION_SMOKE_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-smoke-${{ env.PRODUCTION_SMOKE_REQUEST_ID }}
          path: production-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 14
