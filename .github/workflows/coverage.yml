---
name: Coverage report
run-name: >-
  ${{ (github.event_name != 'pull_request' ||
  (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
  (github.event.action == 'labeled' &&
   github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))) && format('{0} validation', github.workflow) || 'Deferred validation' }}

'on':
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  coverage:
    name: >-
      ${{ (github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))) && 'coverage' || 'coverage-deferred' }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'labeled' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == format('deps:ci:{0}', github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Collect coverage separately from performance measurements
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee "$RUNNER_TEMP/coverage-test-output.txt"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage
            ${{ runner.temp }}/coverage-test-output.txt
          if-no-files-found: error
          retention-days: 14
